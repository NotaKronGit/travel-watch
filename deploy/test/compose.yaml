# Dedicated broker for destructive outage tests; no application data here.
name: travel-watch-kafka-test
services:
  kafka:
    extends: {file: ../compose/kafka.yaml, service: kafka}
    restart: "no"
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
volumes:
  kafka_data:
