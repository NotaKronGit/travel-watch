name: travel-watch
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CABINET_DATABASE_OWNER_PASSWORD: ${CABINET_DATABASE_OWNER_PASSWORD:?Set CABINET_DATABASE_OWNER_PASSWORD in .env}
      CABINET_DATABASE_APP_PASSWORD: ${CABINET_DATABASE_APP_PASSWORD:?Set CABINET_DATABASE_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CABINET_DATABASE_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-cabinet.sql:/docker-entrypoint-initdb.d/10-cabinet.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d cabinet"]
      interval: 2s
      timeout: 3s
      retries: 30
  kafka:
    extends: {file: kafka.yaml, service: kafka}
    ports: ["127.0.0.1:9092:19092"]
    environment:
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
  kafka-init:
    extends: {file: kafka.yaml, service: kafka-init}
volumes:
  kafka_data:
  postgres_data:
