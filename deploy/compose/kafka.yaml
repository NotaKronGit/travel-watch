# Shared single-node development broker. Each Compose project owns its volume.
services:
  kafka:
    image: apache/kafka:4.1.2
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:9092, --list]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 15s
  kafka-init:
    image: apache/kafka:4.1.2
    restart: "no"
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, kafka:9092, --create, --if-not-exists, --topic, "${CABINET_OUTBOX_TOPIC:-travelwatch.trip-requests.v1}", --partitions, "1", --replication-factor, "1", --config, min.insync.replicas=1]
    depends_on:
      kafka: {condition: service_healthy}
