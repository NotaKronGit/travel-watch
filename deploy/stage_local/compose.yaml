name: travel-watch-stage-local
x-cabinet: &cabinet-image
  image: travel-watch-cabinet:${IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: services/cabinet/Dockerfile
services:
  search-results:
    image: travel-watch-search:${IMAGE_TAG:-local}
    build: {context: ../.., dockerfile: services/search/Dockerfile}
    command: [serve-results]
    restart: unless-stopped
    env_file: ../../.local/tls/search.env
    environment:
      SEARCH_RESULTS_ADDRESS: 0.0.0.0:9093
      SEARCH_DATABASE_HOST: postgres
      SEARCH_DATABASE_PORT: "5432"
      SEARCH_DATABASE_APP_PASSWORD: ${SEARCH_DATABASE_APP_PASSWORD:?Set SEARCH_DATABASE_APP_PASSWORD}
    networks: [database, application]
    depends_on:
      search-migrate: {condition: service_completed_successfully}
  search-db-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SEARCH_DATABASE_OWNER_PASSWORD: ${SEARCH_DATABASE_OWNER_PASSWORD:?Set SEARCH_DATABASE_OWNER_PASSWORD}
      SEARCH_DATABASE_APP_PASSWORD: ${SEARCH_DATABASE_APP_PASSWORD:?Set SEARCH_DATABASE_APP_PASSWORD}
    volumes:
      - ../compose/init-search.sql:/init-search.sql:ro
    command: [psql, -h, postgres, -U, postgres, -d, postgres, -v, ON_ERROR_STOP=1, -f, /init-search.sql]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database]
  search-migrate:
    image: travel-watch-search:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: services/search/Dockerfile
    command: [migrate]
    restart: "no"
    environment:
      SEARCH_DATABASE_HOST: postgres
      SEARCH_DATABASE_PORT: "5432"
      SEARCH_DATABASE_OWNER_PASSWORD: ${SEARCH_DATABASE_OWNER_PASSWORD:?Set SEARCH_DATABASE_OWNER_PASSWORD}
      SEARCH_CONSUMER_BROKERS: kafka:9092
      SEARCH_CONSUMER_TOPIC: ${CABINET_OUTBOX_TOPIC:-travelwatch.trip-requests.v1}
    networks: [database]
    depends_on:
      search-db-init: {condition: service_completed_successfully}
  search:
    image: travel-watch-search:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: services/search/Dockerfile
    command: [consume]
    restart: unless-stopped
    environment:
      SEARCH_DATABASE_HOST: postgres
      SEARCH_DATABASE_PORT: "5432"
      SEARCH_DATABASE_APP_PASSWORD: ${SEARCH_DATABASE_APP_PASSWORD:?Set SEARCH_DATABASE_APP_PASSWORD}
      SEARCH_CONSUMER_BROKERS: kafka:9092
      SEARCH_CONSUMER_TOPIC: ${CABINET_OUTBOX_TOPIC:-travelwatch.trip-requests.v1}
    networks: [database, events]
    depends_on:
      search-migrate: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
  progress-topic-init:
    extends: {file: ../compose/kafka.yaml, service: progress-topic-init}
    networks: [events]
  progress-publisher:
    image: travel-watch-search:${IMAGE_TAG:-local}
    build: {context: ../.., dockerfile: services/search/Dockerfile}
    command: [publish-progress]
    restart: unless-stopped
    environment:
      SEARCH_DATABASE_HOST: postgres
      SEARCH_DATABASE_PORT: "5432"
      SEARCH_DATABASE_APP_PASSWORD: ${SEARCH_DATABASE_APP_PASSWORD:?Set SEARCH_DATABASE_APP_PASSWORD}
      SEARCH_PROGRESS_BROKERS: kafka:9092
      SEARCH_PROGRESS_TOPIC: ${ROUTE_BUILDING_TOPIC:-travelwatch.route-building.v1}
    networks: [database, events]
    depends_on:
      search-migrate: {condition: service_completed_successfully}
      progress-topic-init: {condition: service_completed_successfully}
  progress-consumer:
    <<: *cabinet-image
    command: [consume-progress]
    restart: unless-stopped
    environment:
      CABINET_DATABASE_HOST: postgres
      CABINET_DATABASE_PORT: "5432"
      CABINET_DATABASE_APP_PASSWORD: ${CABINET_DATABASE_APP_PASSWORD:?Set CABINET_DATABASE_APP_PASSWORD}
      CABINET_PROGRESS_BROKERS: kafka:9092
      CABINET_PROGRESS_TOPIC: ${ROUTE_BUILDING_TOPIC:-travelwatch.route-building.v1}
    networks: [database, events]
    depends_on:
      migrate: {condition: service_completed_successfully}
      progress-topic-init: {condition: service_completed_successfully}
  route-builder:
    image: travel-watch-search:${IMAGE_TAG:-local}
    build: {context: ../.., dockerfile: services/search/Dockerfile}
    profiles: [planning]
    command: [build-routes]
    restart: unless-stopped
    environment:
      SEARCH_DATABASE_HOST: postgres
      SEARCH_DATABASE_PORT: "5432"
      SEARCH_DATABASE_APP_PASSWORD: ${SEARCH_DATABASE_APP_PASSWORD:?Set SEARCH_DATABASE_APP_PASSWORD}
      COLLECTOR_YANDEX_API_KEY: ${COLLECTOR_YANDEX_API_KEY:-}
      SEARCH_GEMINI_API_KEY: ${SEARCH_GEMINI_API_KEY:-}
      SEARCH_PROGRESS_SOURCES: ${SEARCH_PROGRESS_SOURCES:-graph,gemini}
    networks: [database, application]
    depends_on:
      search-migrate: {condition: service_completed_successfully}
  airports-sync:
    image: travel-watch-search:${IMAGE_TAG:-local}
    build: {context: ../.., dockerfile: services/search/Dockerfile}
    profiles: [tools]
    command: [airports-sync]
    restart: "no"
    environment:
      SEARCH_DATABASE_HOST: postgres
      SEARCH_DATABASE_PORT: "5432"
      SEARCH_DATABASE_APP_PASSWORD: ${SEARCH_DATABASE_APP_PASSWORD:?Set SEARCH_DATABASE_APP_PASSWORD}
    networks: [database, application]
    depends_on:
      search-migrate: {condition: service_completed_successfully}
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CABINET_DATABASE_OWNER_PASSWORD: ${CABINET_DATABASE_OWNER_PASSWORD:?Set CABINET_DATABASE_OWNER_PASSWORD}
      CABINET_DATABASE_APP_PASSWORD: ${CABINET_DATABASE_APP_PASSWORD:?Set CABINET_DATABASE_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../compose/init-cabinet.sql:/docker-entrypoint-initdb.d/10-cabinet.sql:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d cabinet"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *cabinet-image
    command: [migrate]
    restart: "no"
    environment:
      CABINET_DATABASE_HOST: postgres
      CABINET_DATABASE_PORT: "5432"
      CABINET_DATABASE_OWNER_PASSWORD: ${CABINET_DATABASE_OWNER_PASSWORD:?Set CABINET_DATABASE_OWNER_PASSWORD}
    networks: [database]
    depends_on:
      postgres: { condition: service_healthy }
  cities-sync:
    <<: *cabinet-image
    profiles: [tools]
    command: [sync-cities]
    restart: "no"
    environment:
      CABINET_DATABASE_HOST: postgres
      CABINET_DATABASE_PORT: "5432"
      CABINET_DATABASE_OWNER_PASSWORD: ${CABINET_DATABASE_OWNER_PASSWORD:?Set CABINET_DATABASE_OWNER_PASSWORD}
    networks: [database, application]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  cabinet:
    env_file: ../../.local/tls/cabinet.env
    <<: *cabinet-image
    restart: unless-stopped
    environment:
      CABINET_SEARCH_ENABLED: "true"
      CABINET_SEARCH_ADDRESS: https://search-results:9093
      CABINET_DATABASE_HOST: postgres
      CABINET_DATABASE_PORT: "5432"
      CABINET_DATABASE_APP_PASSWORD: ${CABINET_DATABASE_APP_PASSWORD:?Set CABINET_DATABASE_APP_PASSWORD}
      CABINET_SERVER_ADDRESS: 0.0.0.0:8080
      CABINET_SERVER_ORIGIN: http://localhost:${STAGE_LOCAL_PORT:-18080}
      CABINET_AUTH_COOKIE_SECURE: "false"
    networks: [database, application]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
  kafka:
    extends: {file: ../compose/kafka.yaml, service: kafka}
    networks: [events]
  kafka-init:
    extends: {file: ../compose/kafka.yaml, service: kafka-init}
    networks: [events]
  outbox:
    <<: *cabinet-image
    command: [publish-outbox]
    restart: unless-stopped
    environment:
      CABINET_DATABASE_HOST: postgres
      CABINET_DATABASE_PORT: "5432"
      CABINET_DATABASE_APP_PASSWORD: ${CABINET_DATABASE_APP_PASSWORD:?Set CABINET_DATABASE_APP_PASSWORD}
      CABINET_OUTBOX_BROKERS: kafka:9092
      CABINET_OUTBOX_TOPIC: ${CABINET_OUTBOX_TOPIC:-travelwatch.trip-requests.v1}
    networks: [database, events]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
  frontend:
    image: travel-watch-frontend:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:${STAGE_LOCAL_PORT:-18080}:8080"]
    networks: [application]
    depends_on:
      cabinet: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  database: { internal: true }
  events: { internal: true }
  application: {}
volumes:
  postgres_data:
  kafka_data:
