syntax = "proto3";
package travelwatch.search.v1;
import "google/protobuf/timestamp.proto";
option go_package = "github.com/NotaKronGit/travel-watch/gen/travelwatch/search/v1;searchv1";

// Internal gRPC service. Only Cabinet's verified mTLS identity is authorized.
service RouteResultsService {
  rpc GetRoutes(GetRoutesRequest) returns (GetRoutesResponse);
}
message GetRoutesRequest {
  string request_id = 1;
  // Empty selects the first page of every participating source.
  string planner_id = 2;
  int32 offset = 3;
  int32 page_size = 4;
}
message RouteStep {
  string description = 1;
  string mode = 2;
  // Source evidence, not confirmation of timetable compatibility.
  string evidence = 3;
}
message RouteScheme {
  repeated RouteStep steps = 1;
  repeated string warnings = 2;
}
message SourceRoutes {
  string planner_id = 1;
  string stage = 2;
  string outcome = 3;
  int32 attempt = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  int64 duration_ms = 7;
  bool incomplete = 8;
  int32 total = 9;
  int32 offset = 10;
  bool has_more = 11;
  repeated RouteScheme routes = 12;
  repeated string warnings = 13;
}
message GetRoutesResponse {
  int64 revision = 1;
  string stage = 2;
  repeated SourceRoutes sources = 3;
  ScheduleCheck schedule_check = 4;
}

// Saved timetable check; reading it never invokes a supplier.
message ScheduleCheck {
 string state = 1;
 google.protobuf.Timestamp checked_at = 2;
 bool incomplete = 3;
 int32 requests = 4;
 repeated string warnings = 5;
 repeated ScheduledScheme schemes = 6;
 // Next periodic re-check of an active request; absent when none is planned.
 google.protobuf.Timestamp next_check_at = 7;
 // The last re-check failed; the previous result shown here was kept.
 google.protobuf.Timestamp refresh_failed_at = 8;
}
message ScheduledScheme {
 int32 scheme_number = 1;
 int32 access_variant = 2;
 string state = 3;
 repeated string warnings = 4;
 repeated ScheduledJourney journeys = 5;
}
message ScheduledJourney {
 repeated ScheduledLeg legs = 1;
 repeated string warnings = 2;
 bool timing_verified = 3;
}
message ScheduledLeg {
 string from = 1;
 string to = 2;
 string mode = 3;
 string number = 4;
 // RFC3339 with the station offset, preserved for display.
 string departure = 5;
 string arrival = 6;
 google.protobuf.Timestamp observed_at = 7;
 int64 connection_minutes = 8;
 int64 required_minutes = 9;
 // Ground transfer ahead of this leg, empty when the legs share a node.
 string transfer_from = 10;
 string transfer_to = 11;
 // Boarding preparation before this leg: check-in for a flight. Set with a transfer;
 // connection_minutes minus this is the time left for the transfer itself.
 int64 boarding_minutes = 12;
}
