syntax = "proto3";
package travelwatch.cabinet.v1;
import "google/protobuf/timestamp.proto";
option go_package = "github.com/NotaKronGit/travel-watch/gen/travelwatch/cabinet/v1;cabinetv1";

service TripService {
  rpc SearchCities(SearchCitiesRequest) returns (SearchCitiesResponse);
  rpc ListTrips(ListTripsRequest) returns (ListTripsResponse);
  rpc GetTrip(GetTripRequest) returns (GetTripResponse);
  rpc CreateTrip(CreateTripRequest) returns (CreateTripResponse);
}
message CityOption {
  string id = 1;
  string name = 2;
  string country = 3;
  string region = 4;
  string timezone = 5;
  // Optional code attached to this city by the catalog source.
  string iata_code = 6;
}
message SearchCitiesRequest { string query = 1; }
message SearchCitiesResponse { repeated CityOption cities = 1; }
message CreateTripRequest {
  string request_id = 1;
  string origin_id = 2;
  string destination_id = 3;
  // Inclusive calendar dates in the origin city's timezone: YYYY-MM-DD.
  string departure_from = 4;
  string departure_to = 5;
  int32 adults = 6;
}
message CreateTripResponse { string id = 1; }

message TripDetails {
  string id = 1;
  CityOption origin = 2;
  CityOption destination = 3;
  string departure_from = 4;
  string departure_to = 5;
  int32 adults = 6;
  google.protobuf.Timestamp created_at = 7;
}
message ListTripsRequest { int32 offset = 1; }
message ListTripsResponse {
  repeated TripDetails trips = 1;
  bool has_more = 2;
}
message GetTripRequest { string id = 1; }
message GetTripResponse { TripDetails trip = 1; }
