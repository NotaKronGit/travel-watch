syntax = "proto3";
package travelwatch.cabinet.v1;
import "google/protobuf/timestamp.proto";
option go_package = "github.com/NotaKronGit/travel-watch/gen/travelwatch/cabinet/v1;cabinetv1";

service TripService {
  rpc SearchCities(SearchCitiesRequest) returns (SearchCitiesResponse);
  rpc ListTrips(ListTripsRequest) returns (ListTripsResponse);
  rpc GetTrip(GetTripRequest) returns (GetTripResponse);
  rpc CancelTrip(CancelTripRequest) returns (CancelTripResponse);
  rpc UpdateTripComment(UpdateTripCommentRequest) returns (UpdateTripCommentResponse);
  rpc CreateTrip(CreateTripRequest) returns (CreateTripResponse);
}
message CityOption {
  string id = 1;
  string name = 2;
  string country = 3;
  string region = 4;
  string timezone = 5;
  // Optional code attached to this city by the catalog source.
  string iata_code = 6;
}
message SearchCitiesRequest { string query = 1; }
message SearchCitiesResponse { repeated CityOption cities = 1; }
message CreateTripRequest {
  string request_id = 1;
  string origin_id = 2;
  string destination_id = 3;
  // Inclusive calendar dates in the origin city's timezone: YYYY-MM-DD.
  string departure_from = 4;
  string departure_to = 5;
  int32 adults = 6;
}
message CreateTripResponse { string id = 1; }

enum TripStatus {
  TRIP_STATUS_UNSPECIFIED = 0;
  TRIP_STATUS_SAVED = 1;
  TRIP_STATUS_RUNNING = 2;
  TRIP_STATUS_CANCELLED = 3;
  TRIP_STATUS_COMPLETED = 4;
}
message CancelTripRequest { string id = 1; }
message CancelTripResponse {}
message UpdateTripCommentRequest { string id = 1; string comment = 2; }
message UpdateTripCommentResponse {}
message TripDetails {
  string id = 1;
  CityOption origin = 2;
  CityOption destination = 3;
  string departure_from = 4;
  string departure_to = 5;
  int32 adults = 6;
  google.protobuf.Timestamp created_at = 7;
  TripStatus status = 8;
  string comment = 9;
  google.protobuf.Timestamp cancelled_at = 10;
  // Search stage is independent from the overall trip lifecycle.
  string building_stage = 11;
  repeated TripStageHistory history = 12;

}
message ListTripsRequest { int32 offset = 1; }
message ListTripsResponse {
  repeated TripDetails trips = 1;
  bool has_more = 2;
}
message GetTripRequest { string id = 1; }
message GetTripResponse { TripDetails trip = 1; }

message TripStageHistory {
  int64 revision = 1;
  string stage = 2;
  google.protobuf.Timestamp occurred_at = 3;
  int32 attempt = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  int64 duration_ms = 7;
  int32 route_count = 8;
  bool incomplete = 9;
  string planner_id = 10;
}
