name: Build images
on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - service: cabinet
            dockerfile: services/cabinet/Dockerfile
          - service: search
            dockerfile: services/search/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Restore Docker Go compiler cache
        if: matrix.service != 'frontend'
        id: go-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/docker-go-build
          key: docker-go-build-v1-${{ matrix.service }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', matrix.dockerfile) }}-${{ github.sha }}
          restore-keys: |
            docker-go-build-v1-${{ matrix.service }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', matrix.dockerfile) }}-
      - name: Restore and save BuildKit cache mount
        if: matrix.service != 'frontend'
        uses: reproducible-containers/buildkit-cache-dance@4b2444fec0c0fb9dbf175a96c094720a692ef810 # v2.1.4
        with:
          cache-source: ${{ runner.temp }}/docker-go-build
          cache-target: /root/.cache/go-build
          scratch-dir: ${{ runner.temp }}/cache-dance
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"
        env:
          SERVICE: ${{ matrix.service }}
      - uses: docker/login-action@v3
        if: inputs.publish && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
