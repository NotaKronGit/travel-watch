name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          go mod download
          go install github.com/bufbuild/buf/cmd/buf@v1.61.0
      - name: Format, contracts and build
        run: |
          test -z "$(gofmt -l services gen)"
          make generate
          git diff --exit-code -- gen frontend/src/gen
          make check
          npm --prefix frontend test
      - name: Start PostgreSQL and test migrations
        run: |
          cp .env.example .env
          make db-up
          make migrate
          make test-int
      - name: Browser tests
        run: |
          npx --prefix frontend playwright install --with-deps chromium
          make cabinet > "$RUNNER_TEMP/cabinet.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7
      - name: Validate Compose configurations
        env:
          POSTGRES_PASSWORD: ci-postgres
          CABINET_DATABASE_OWNER_PASSWORD: ci-owner
          CABINET_DATABASE_APP_PASSWORD: ci-app
        run: |
          docker compose -f deploy/stage_local/compose.yaml config --quiet
          docker compose -f deploy/dev/compose.yaml config --quiet
  images:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: cabinet
            dockerfile: services/cabinet/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"
        env:
          SERVICE: ${{ matrix.service }}
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  dev-latest:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote both built images to dev-latest
        shell: bash
        run: |
          for service in cabinet frontend; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}/${service}"
            docker buildx imagetools create --tag "${image}:dev-latest" "${image}:${GITHUB_SHA}"
          done
