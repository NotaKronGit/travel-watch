database:
  host: 127.0.0.1
  port: 55432
  name: search
  sslmode: disable
  app_user: search_app
  app_password: ""
  owner_user: search_owner
  owner_password: ""
  connect_timeout: 5s
  ping_timeout: 5s
  max_open_conns: 5
  max_idle_conns: 2
  conn_max_lifetime: 30m
  migration_timeout: 1m
consumer:
  brokers: [127.0.0.1:9092]
  topic: travelwatch.trip-requests.v1
  group_id: travelwatch-search-v1
  db_timeout: 5s
  commit_timeout: 10s
  dial_timeout: 5s
gemini:
  model: gemini-3.5-flash-lite
  api_key: ""
  timeout: 30s
  max_output_tokens: 1024
  max_request_bytes: 32768
  max_response_bytes: 65536
airports:
  url: https://davidmegginson.github.io/ourairports-data/airports.csv
  download_timeout: 1m
  import_timeout: 5m
  max_bytes: 33554432
  min_rows: 70000
  max_rows: 200000
  min_retained_percent: 90
planner:
  collector_binary: bin/collector
  timeout: 8m
  airport_radius_km: 180
  hub_radius_km: 1000
  rail_radius_km: 50
  max_airports: 3
  max_hubs: 12
  max_pages: 5
  max_requests: 240
  max_candidates: 20

progress:
  sources: [graph, gemini]
  brokers: [127.0.0.1:9092]
  topic: travelwatch.route-building.v1
  group_id: travelwatch-cabinet-progress-v1
  poll_interval: 2s
  timeout: 10s
  lease: 10m
  max_attempts: 3

results:
  address: 127.0.0.1:9093
  timeout: 2s
  shutdown_timeout: 5s
  tls:
    peer_name: cabinet
    ca_base64: ""
    cert_base64: ""
    key_base64: ""
