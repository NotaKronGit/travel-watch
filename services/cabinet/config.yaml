# Cabinet. Секреты задаются через окружение, этот файл можно хранить в Git.
server:
  address: 127.0.0.1:8080
  origin: http://localhost:5173
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s
  request_timeout: 5s
  health_timeout: 1s
  max_header_bytes: 16384
  max_body_bytes: 8192
database:
  host: 127.0.0.1
  port: 55432
  name: cabinet
  sslmode: disable
  app_user: cabinet_app
  app_password: ""
  owner_user: cabinet_owner
  owner_password: ""
  connect_timeout: 5s
  ping_timeout: 5s
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m
  migration_timeout: 1m
auth:
  cookie_secure: false # Только для локального HTTP.
  session_ttl: 168h
  cleanup_interval: 1h
  cleanup_timeout: 5s
  login_attempts: 10
  login_window: 1m
  max_tracked_addresses: 4096
  hash_concurrency: 4
