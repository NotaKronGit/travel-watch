# Cabinet. Секреты задаются через окружение, этот файл можно хранить в Git.
server:
  address: 127.0.0.1:8080
  origin: http://localhost:5173
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s
  request_timeout: 5s
  health_timeout: 1s
  max_header_bytes: 16384
  max_body_bytes: 8192
database:
  host: 127.0.0.1
  port: 55432
  name: cabinet
  sslmode: disable
  app_user: cabinet_app
  app_password: ""
  owner_user: cabinet_owner
  owner_password: ""
  connect_timeout: 5s
  ping_timeout: 5s
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m
  migration_timeout: 1m
auth:
  cookie_secure: false # Только для локального HTTP.
  session_ttl: 168h
  cleanup_interval: 1h
  cleanup_timeout: 5s
  login_attempts: 10
  login_window: 1m
  max_tracked_addresses: 4096
  hash_concurrency: 4
catalog:
  cities_url: https://download.geonames.org/export/dump/cities500.zip
  regions_url: https://download.geonames.org/export/dump/admin1CodesASCII.txt
  countries_url: https://download.geonames.org/export/dump/countryInfo.txt
  alternate_names_url: https://download.geonames.org/export/dump/alternateNamesV2.zip
  max_alternate_download_bytes: 268435456
  max_alternate_uncompressed_bytes: 2147483648
  http_timeout: 5m
  sync_timeout: 10m
  max_download_bytes: 33554432
  max_uncompressed_bytes: 134217728
  min_cities: 100000 # Reject an unexpectedly incomplete world snapshot.
  max_cities: 300000
outbox:
  brokers: [127.0.0.1:9092]
  topic: travelwatch.trip-requests.v1
  poll_interval: 1s
  db_timeout: 5s
  publish_timeout: 10s
  lease_duration: 30s
  retry_min: 1s
  retry_max: 1m

progress:
  brokers: [127.0.0.1:9092]
  topic: travelwatch.route-building.v1
  group_id: travelwatch-cabinet-progress-v1
  poll_interval: 2s
  timeout: 10s
  lease: 10m
  max_attempts: 3

search:
  enabled: false
  address: https://localhost:9093
  timeout: 3s
  tls:
    peer_name: search
    ca_base64: ""
    cert_base64: ""
    key_base64: ""
